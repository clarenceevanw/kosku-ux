services:
  # 1. Server Utama: Apache + PHP 8.3
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kosku_app
    restart: unless-stopped
    ports:
      - "8000:80"
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis

  # 2. Database: MySQL 8.0
  db:
    image: mysql:8.0
    container_name: kosku_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: kosku
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: kosku_user
    volumes:
      - db_data:/var/lib/mysql

  # 3. Database Management: phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: kosku_pma
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

  # 4. Cache & Queue: Redis
  redis:
    image: redis:alpine
    container_name: kosku_redis
    ports:
      - "6379:6379"

volumes:
  db_data: